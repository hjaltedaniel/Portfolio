<svg xmlns="http://www.w3.org/2000/svg" width="640" height="908" viewBox="0 0 640 908" role="img" aria-labelledby="title desc">
<title id="title">A page combining curated messaging with discovery</title>
<desc id="desc">A campaign-specific headline and advisory call to action form the curated frame. A separate module contains a dynamically selected guide and webinar. Editorial eligibility applies to both; the shared goal is a qualified next step.</desc>
